name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kernloom
          POSTGRES_PASSWORD: kernloom
          POSTGRES_DB: kernloom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kernloom -d kernloom_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go fmt ./...
      - run: go vet ./...
      - run: go test ./...
      - run: go test -tags integration ./internal/forge/management ./internal/forge/jobs
        env:
          KERNLOOM_TEST_POSTGRES_DSN: postgres://kernloom:kernloom@127.0.0.1:5432/kernloom_test?sslmode=disable
          KERNLOOM_TEST_REDIS_ADDR: 127.0.0.1:6379
      - run: make build
      - run: bin/klctl registry validate --core-registry internal/forge/testdata/core-registry --enterprise-registry internal/forge/testdata/enterprise-registry
      - name: Optional adapter runtime verify
        if: ${{ vars.KERNLOOM_CI_ADAPTER_VERIFY_ENDPOINT != '' }}
        run: >
          bin/klctl adapter verify
          --adapter "$KERNLOOM_CI_ADAPTER_VERIFY_ID"
          --endpoint "$KERNLOOM_CI_ADAPTER_VERIFY_ENDPOINT"
          --manifest "$KERNLOOM_CI_ADAPTER_VERIFY_MANIFEST"
          --dev-insecure-transport
        env:
          KERNLOOM_CI_ADAPTER_VERIFY_ID: ${{ vars.KERNLOOM_CI_ADAPTER_VERIFY_ID }}
          KERNLOOM_CI_ADAPTER_VERIFY_ENDPOINT: ${{ vars.KERNLOOM_CI_ADAPTER_VERIFY_ENDPOINT }}
          KERNLOOM_CI_ADAPTER_VERIFY_MANIFEST: ${{ vars.KERNLOOM_CI_ADAPTER_VERIFY_MANIFEST }}
